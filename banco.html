<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID CORUJA - Banco de Indivíduos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .banco-container { background-color: #111a2e; padding: 30px; border-radius: 16px; border: 1px solid #1e2d4a; box-shadow: 0 8px 32px rgba(0, 123, 255, 0.15); width: 95%; max-width: 1300px; margin: 20px; color: #e2e8f0; }
        .header-banco { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e2d4a; padding-bottom: 15px; margin-bottom: 25px; }
        .layout-banco { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        @media (max-width: 992px) { .layout-banco { grid-template-columns: 1fr; } }
        .painel-formulario { background-color: #162238; padding: 20px; border-radius: 12px; border: 1px solid #233554; height: fit-content; }
        .painel-formulario h3, .painel-tabela h3 { color: #00bcd4; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid #233554; }
        .painel-tabela { background-color: #162238; padding: 20px; border-radius: 12px; border: 1px solid #233554; }
        .foto-upload-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .foto-box-preview { width: 130px; height: 130px; border-radius: 12px; border: 2px dashed #00bcd4; background-color: #1e293b; display: flex; justify-content: center; align-items: center; overflow: hidden; object-fit: cover; color: #94a3b8; font-size: 13px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
        .foto-box-preview:hover { border-color: #00e5ff; background-color: #24324d; }
        .tabela-wrapper { overflow-x: auto; max-height: 520px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 12px 8px; border-bottom: 1px solid #233554; vertical-align: middle; }
        th { background-color: #1e293b; color: #00bcd4; font-weight: 600; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #1e2d4a; }
        .tabela-foto-perfil { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; border: 1px solid #00bcd4; cursor: pointer; transition: transform 0.2s; }
        .tabela-foto-perfil:hover { transform: scale(1.1); border-color: #00e5ff; }
        .btn-acao { padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; color: white; width: 100%; }
        .btn-excluir { background-color: #dc3545; }
        .btn-excluir:hover { background-color: #bd2130; }
        .barra-busca { width: 100%; padding: 10px; margin-bottom: 15px; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; outline: none; }
        .barra-busca:focus { border-color: #00bcd4; box-shadow: 0 0 8px rgba(0, 188, 212, 0.4); }
        .foto-modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(7, 11, 22, 0.85); justify-content: center; align-items: center; cursor: zoom-out; }
        .foto-modal-conteudo { max-width: 85%; max-height: 85%; border-radius: 12px; border: 2px solid #00bcd4; box-shadow: 0 0 30px rgba(0, 188, 212, 0.4); object-fit: contain; }
    </style>
</head>
<body>
    <div class="banco-container">
        <div class="header-banco">
            <h2>🗂️ Banco de Dados de Indivíduos</h2>
            <div>
                <button onclick="window.location.href='dashboard.html'" class="btn" style="width: auto; display: inline-block; padding: 8px 15px; margin-right: 10px; background: #495057; box-shadow: none;">Voltar</button>
                <button onclick="logout()" class="btn btn-sair" style="width: auto; display: inline-block; padding: 8px 15px;">Sair</button>
            </div>
        </div>

        <div class="layout-banco">
            <div class="painel-formulario">
                <h3>Novo Cadastro</h3>
                <form id="formIndividuo">
                    <div class="foto-upload-container">
                        <label style="color: #94a3b8; font-size: 14px; margin-bottom: 8px; align-self: flex-start;">Foto do Indivíduo</label>
                        <div id="fotoBoxPreview" class="foto-box-preview" onclick="document.getElementById('inputFoto').click()">
                            <span>Clique para<br>anexar foto</span>
                        </div>
                        <input type="file" id="inputFoto" accept="image/*" style="display: none;" required>
                    </div>

                    <div class="input-group">
                        <label for="indNome">Nome Completo</label>
                        <input type="text" id="indNome" required placeholder="Digite o nome completo">
                    </div>
                    <div class="input-group">
                        <label for="indAlcunha">Alcunha / Vulgo</label>
                        <input type="text" id="indAlcunha" required placeholder="Apelido ou Vulgo">
                    </div>
                    <div class="input-group">
                        <label for="indCpf">CPF</label>
                        <input type="text" id="indCpf" required placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
                    </div>
                    <div class="input-group">
                        <label for="indNasc">Data de Nascimento</label>
                        <input type="date" id="indNasc" required style="color-scheme: dark;">
                    </div>
                    <div class="input-group">
                        <label for="indFiliacao">Filiação</label>
                        <input type="text" id="indFiliacao" required placeholder="Nome dos pais">
                    </div>
                    <div class="input-group">
                        <label for="indEndereco">Endereço Completo</label>
                        <input type="text" id="indEndereco" required placeholder="Rua, Número, Bairro, Cidade">
                    </div>
                    <div class="input-group">
                        <label for="indObs">Observações Gerais</label>
                        <input type="text" id="indObs" placeholder="Restrições ou notas adicionais">
                    </div>
                    <button type="submit" class="btn">Salvar no Banco</button>
                </form>
            </div>

            <div class="painel-tabela">
                <h3>Registros Salvos (<span id="totalRegistros">0</span>)</h3>
                <input type="text" id="campoBusca" class="barra-busca" placeholder="🔍 Buscar por nome, alcunha, CPF..." oninput="filtrarTabela()">
                <div class="tabela-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 50px;">Foto</th>
                                <th>Nome</th>
                                <th>Alcunha</th>
                                <th>CPF</th>
                                <th>Nascimento</th>
                                <th>Filiação</th>
                                <th>Endereço</th>
                                <th>Observações</th>
                                <th style="width: 100px;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="modalZoom" class="foto-modal" onclick="fecharZoom()">
        <img id="imagemZoom" class="foto-modal-conteudo" alt="Foto Ampliada" onclick="event.stopPropagation()">
    </div>

    <script>
        let fotoStringBase64 = ""; 

        document.addEventListener("DOMContentLoaded", () => {
            if (!localStorage.getItem("usuarioSessaoAtiva")) {
                window.location.href = "index.html";
                return;
            }
            renderizarTabela();
        });

        function mascaraCPF(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 3) v = v.replace(/^(\d{3})(\d)/, "$1.$2");
            if (v.length > 6) v = v.replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
            if (v.length > 9) v = v.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3-$4");
            input.value = v;
        }

        document.getElementById('inputFoto').addEventListener('change', function(e) {
            const arquivo = e.target.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(event) {
                    fotoStringBase64 = event.target.result;
                    document.getElementById('fotoBoxPreview').innerHTML = `<img src="${fotoStringBase64}" style="width:100%; height:100%; object-fit:cover;">`;
                };
                leitor.readAsDataURL(arquivo);
            }
        });

        function obterBancoIndividuos() {
            const banco = localStorage.getItem('db_individuos_lista');
            return banco ? JSON.parse(banco) : [];
        }

        document.getElementById('formIndividuo').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!fotoStringBase64) { alert("Por favor, anexe uma foto!"); return; }

            const cpf = document.getElementById('indCpf').value.trim();
            const lista = obterBancoIndividuos();

            if (lista.some(p => p.cpf === cpf)) {
                alert("Este CPF já está registrado!");
                return;
            }

            const novoIndividuo = {
                id: Date.now(),
                foto: fotoStringBase64,
                nome: document.getElementById('indNome').value.trim(),
                alcunha: document.getElementById('indAlcunha').value.trim(),
                cpf: cpf,
                nascimento: formatarData(document.getElementById('indNasc').value),
                filiacao: document.getElementById('indFiliacao').value.trim(),
                endereco: document.getElementById('indEndereco').value.trim(),
                obs: document.getElementById('indObs').value.trim() || "Nenhuma"
            };

            lista.push(novoIndividuo);
            localStorage.setItem('db_individuos_lista', JSON.stringify(lista));

            document.getElementById('formIndividuo').reset();
            document.getElementById('fotoBoxPreview').innerHTML = "<span>Clique para<br>anexar foto</span>";
            fotoStringBase64 = "";
            renderizarTabela();
        });

        function renderizarTabela() {
            const lista = obterBancoIndividuos();
            document.getElementById('totalRegistros').textContent = lista.length;
            const corpo = document.getElementById('corpoTabela');
            corpo.innerHTML = "";

            if (lista.length === 0) {
                corpo.innerHTML = `<tr><td colspan="9" style="text-align: center; color: #94a3b8;">Nenhum indivíduo cadastrado ainda.</td></tr>`;
                return;
            }

            lista.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${p.foto}" class="tabela-foto-perfil" alt="Foto" onclick="abrirZoom('${p.foto}')"></td>
                    <td style="font-weight: bold; color: white;">${CleanText(p.nome)}</td>
                    <td style="color: #00bcd4; font-weight: bold;">${CleanText(p.alcunha)}</td>
                    <td>${CleanText(p.cpf)}</td>
                    <td>${CleanText(p.nascimento)}</td>
                    <td>${CleanText(p.filiacao)}</td>
                    <td>${CleanText(p.endereco)}</td>
                    <td style="color: #94a3b8; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${CleanText(p.obs)}</td>
                    <td><button class="btn-acao btn-excluir" onclick="removerIndividuo(${p.id})">Excluir</button></td>
                `;
                corpo.appendChild(tr);
            });
        }

        function removerIndividuo(id) {
            if (confirm("Deseja apagar este registro?")) {
                let lista = obterBancoIndividuos();
                lista = lista.filter(p => p.id !== id);
                localStorage.setItem('db_individuos_lista', JSON.stringify(lista));
                renderizarTabela();
            }
        }

        function abrirZoom(src) { const m = document.getElementById('modalZoom'); document.getElementById('imagemZoom').src = src; m.style.display = "flex"; }
        function fecharZoom() { document.getElementById('modalZoom').style.display = "none"; }
        function filtrarTabela() { const t = document.getElementById('campoBusca').value.toLowerCase(); document.querySelectorAll('#corpoTabela tr').forEach(r => r.style.display = r.textContent.toLowerCase().includes(t) ? "" : "none"); }
        function formatarData(d) { if(!d) return ""; const p = d.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }
        const CleanText = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        function logout() { localStorage.removeItem("usuarioSessaoAtiva"); window.location.href = "index.html"; }
    </script>
</body>
</html>
